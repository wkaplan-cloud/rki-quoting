<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent}
  #stage{display:inline-flex;align-items:center;gap:40px;padding:14px 18px;box-sizing:border-box}

  .mark{position:relative;width:196px;height:196px;flex:0 0 196px;border-radius:34px;
        background:
          radial-gradient(120% 120% at 22% 8%, #1E4463 0%, #14293D 46%, #0C1B29 100%);
        box-shadow:0 18px 34px -18px rgba(12,27,41,.55), inset 0 1px 0 rgba(255,255,255,.10);
        display:flex;align-items:center;justify-content:center;overflow:hidden}
  .mark::after{content:'';position:absolute;inset:0;border-radius:34px;
        border:1.5px solid rgba(240,168,40,.32)}
  .mark .glow{position:absolute;width:150px;height:150px;left:-30px;bottom:-46px;border-radius:50%;
        background:radial-gradient(circle,rgba(240,168,40,.16) 0%,rgba(240,168,40,0) 72%)}
  .mark svg{position:relative;width:104px;height:104px}

  .word{display:flex;flex-direction:column;justify-content:center}
  .n{font-family:'Archivo',-apple-system,Helvetica,Arial,sans-serif;font-weight:800;font-size:96px;
     letter-spacing:-.035em;line-height:.92;color:#0F2436}
  .n span{color:#E09A22}
  .e{display:flex;align-items:center;gap:14px;margin-top:12px}
  .e .rule{width:52px;height:4px;border-radius:2px;background:#E09A22}
  .e .txt{font-family:'Archivo',-apple-system,Helvetica,Arial,sans-serif;font-weight:600;font-size:37px;
     letter-spacing:.30em;color:#3E5A72;text-transform:uppercase}
  .tag{font-family:'Barlow Condensed','Archivo',Helvetica,Arial,sans-serif;font-weight:600;font-size:22px;
     letter-spacing:.20em;color:#8298A9;text-transform:uppercase;margin-top:14px}
</style></head>
<body><div id="stage">
  <div class="mark">
    <div class="glow"></div>
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M62 5 L23 57 H45.5 L38 95 L79 41 H55.5 Z"
            fill="#F0A828" stroke="#F7C46A" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="word">
    <div class="n">NEXU<span>S</span></div>
    <div class="e"><div class="rule"></div><div class="txt">Electrical</div></div>
    <div class="tag">Electrical Contractors &middot; Johannesburg</div>
  </div>
</div></body></html>
